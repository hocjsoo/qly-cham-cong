<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111315" />
      <stop offset="50%" stop-color="#272b2e" />
      <stop offset="100%" stop-color="#4b5156" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />
  
  <!-- Subtle Top Light Reflection -->
  <rect width="512" height="256" rx="124" fill="url(#glowGrad)" />
  
  <!-- Inner Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Monogram ET Icon -->
  <g filter="url(#dropShadow)" transform="translate(0, 4)">
    <!-- Architectural Monogram E -->
    <path d="M 116 160 L 244 160 C 255 160 262 167 262 178 C 262 189 255 196 244 196 L 158 196 L 158 238 L 232 238 C 243 238 250 245 250 256 C 250 267 243 274 232 274 L 158 274 L 158 316 L 244 316 C 255 316 262 323 262 334 C 262 345 255 352 244 352 L 116 352 C 105 352 98 345 98 334 L 98 178 C 98 167 105 160 116 160 Z" fill="#ffffff" />

    <!-- Architectural Monogram T -->
    <path d="M 276 160 L 404 160 C 415 160 422 167 422 178 C 422 189 415 196 404 196 L 368 196 L 368 334 C 368 345 361 352 350 352 C 339 352 332 345 332 334 L 332 196 L 276 196 C 265 196 258 189 258 178 C 258 167 265 160 276 160 Z" fill="#ffffff" />
    
    <!-- Neutral architectural accent -->
    <circle cx="396" cy="336" r="16" fill="#d7dadd" />
  </g>
</svg>
