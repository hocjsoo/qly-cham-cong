<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#17191b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('theme') || localStorage.getItem('et-theme');
          const initialTheme = storedTheme === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = initialTheme;
          document.querySelector('meta[name="theme-color"]').content = initialTheme === 'light' ? '#f4f3ef' : '#17191b';
        } catch {}
      })();
    </script>
    <meta name="description" content="Kiến trúc ET - Hệ thống chấm công và nhân sự thông minh trên web/mobile." />
    
    <!-- PWA Web App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiến trúc ET" />
    <link rel="manifest" href="/manifest.json" />

    <title>Kiến trúc ET — Chấm Công Thông Minh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
